<svg xmlns="http://www.w3.org/2000/svg" width="200" height="240" viewBox="0 0 200 240" role="img" aria-labelledby="title desc">
  <title id="title">LevelSetPy Supplementary Results: Examples and Evaluations</title>
  <desc id="desc">Animated conceptual illustration: reachability. Schematic only; not experimental data.</desc>
  <style>
    .flow { stroke-dasharray: 4 7; animation: flow 3s linear infinite; }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    .late { animation-delay: -2s; }
    .ring { transform-origin: 100px 120px; animation: ring 6s ease-in-out infinite; }
    .turn { transform-origin: 100px 120px; animation: turn 16s linear infinite; }
    .bend { transform-origin: 100px 183px; animation: bend 7s ease-in-out infinite; }
    .correct { transform-origin: 100px 112px; animation: correct 6s ease-in-out infinite; }
    .travel { animation: travel 8s linear infinite; }
    .interpolate { animation: interpolate 7s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -44; } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes ring { 0%, 100% { transform: scale(.85); } 50% { transform: scale(1.08); } }
    @keyframes turn { to { transform: rotate(360deg); } }
    @keyframes bend { 0%, 100% { transform: rotate(-9deg); } 50% { transform: rotate(9deg); } }
    @keyframes correct { 0%, 100% { transform: translate(5px, -3px) rotate(4deg); } 40%, 70% { transform: none; } }
    @keyframes travel {
      0%, 100% { transform: translate(38px, 176px); }
      25% { transform: translate(38px, 74px); }
      50% { transform: translate(108px, 74px); }
      75% { transform: translate(162px, 176px); }
    }
    @keyframes interpolate {
      0%, 100% { transform: translate(50px, 165px); }
      33% { transform: translate(85px, 127px); }
      66% { transform: translate(140px, 90px); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .travel { transform: translate(38px, 125px); }
      .interpolate { transform: translate(85px, 127px); }
    }
  </style>
  <path fill="#101e30" d="M0 0h200v240H0z"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="100" y="27" fill="#c1d3e5" font-size="10" letter-spacing="1">REACHABILITY</text>
    <text x="100" y="222" fill="#8aa4bc" font-size="9" letter-spacing=".8">BENCHMARK · COMPARE</text>
  </g>
  <path d="M30 52V190M30 55H170" fill="none" stroke="#26364a" stroke-width="0.7" class="" stroke-linecap="round" stroke-linejoin="round" /><path d="M50 52V190M30 75H170" fill="none" stroke="#26364a" stroke-width="0.7" class="" stroke-linecap="round" stroke-linejoin="round" /><path d="M70 52V190M30 95H170" fill="none" stroke="#26364a" stroke-width="0.7" class="" stroke-linecap="round" stroke-linejoin="round" /><path d="M90 52V190M30 115H170" fill="none" stroke="#26364a" stroke-width="0.7" class="" stroke-linecap="round" stroke-linejoin="round" /><path d="M110 52V190M30 135H170" fill="none" stroke="#26364a" stroke-width="0.7" class="" stroke-linecap="round" stroke-linejoin="round" /><path d="M130 52V190M30 155H170" fill="none" stroke="#26364a" stroke-width="0.7" class="" stroke-linecap="round" stroke-linejoin="round" /><path d="M150 52V190M30 175H170" fill="none" stroke="#26364a" stroke-width="0.7" class="" stroke-linecap="round" stroke-linejoin="round" /><path d="M170 52V190M30 195H170" fill="none" stroke="#26364a" stroke-width="0.7" class="" stroke-linecap="round" stroke-linejoin="round" /><g class="ring"><ellipse cx="100" cy="120" rx="65" ry="46.8" fill="none" stroke="#48627c" stroke-width="1.7"/><ellipse cx="100" cy="120" rx="48" ry="34.56" fill="none" stroke="#78b9ff" stroke-width="1.7"/><ellipse cx="100" cy="120" rx="30" ry="21.599999999999998" fill="none" stroke="#62dfc3" stroke-width="1.7"/></g><circle cx="62" cy="104" r="2" fill="#f7c977" class="pulse late" /><circle cx="82" cy="136" r="2" fill="#f7c977" class="pulse" /><circle cx="116" cy="101" r="2" fill="#f7c977" class="pulse late" /><circle cx="138" cy="128" r="2" fill="#f7c977" class="pulse" /><circle cx="103" cy="158" r="2" fill="#f7c977" class="pulse late" /><circle cx="92" cy="80" r="2" fill="#f7c977" class="pulse" /><circle cx="100" cy="120" r="4" fill="#62dfc3" class="" />
</svg>
